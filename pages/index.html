<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a id="login" href="/auth/oauth2_basic">登陆</a>
    <button id="nextchat" onClick="hanldeSubmitNextchat()">对话</button>
</body>
    <script>
        var loading = false
        var nextchat = ""
        function hanldeSubmitNextchat(){
            if (nextchat){
                loading = false
                window.open(data.nextchat)
                return
            }
            if (loading){
                return
            }
            loading = true
            // 简单GET请求
            fetch('/api/kcai/token').then(response => {
                return response.json(); // 解析JSON数据
            }).then(data => {
                console.log(data); // 处理数据
                if( data.success && data.data.token){
                    nextchat = "/chat/#/?token="+data.data.token
                    window.open(nextchat)
                }else{
                    alert("请先登陆")
                }
            }).catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            }).finally(()=>{
                loading = false
            })
        }
    </script>
</html>
